# Netlify deploy config for the Remy AI web app (Next.js, pnpm monorepo).
# The API (NestJS) and Postgres do NOT run on Netlify — see Docs/Deployment-Netlify.md.

[build]
  base = "/"
  command = "pnpm install && pnpm --filter web run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"

# NEXT_PUBLIC_API_URL is set in the Netlify UI (Site settings → Environment
# variables) to the SAME ORIGIN: https://remyaii.netlify.app/api
# (proxied below to Render). Same-origin keeps login + session cookies
# first-party, which Chrome requires — cross-site cookies get blocked.

# Reverse proxy: same-origin /api/* → Render. Forwards path, query,
# method, headers and cookies transparently.
[[redirects]]
  from = "/api/*"
  to = "https://remy-ai-api.onrender.com/api/:splat"
  status = 200
