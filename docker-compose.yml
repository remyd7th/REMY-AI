services:
  db:
    image: pgvector/pgvector:pg16
    container_name: remy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: remy
      POSTGRES_USER: remy
      POSTGRES_PASSWORD: remy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: remy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
